# Config blocks layered on top of upstream's dreamerv3/configs.yaml by
# carnav_dreamer/train.py. Same mechanics as upstream: `defaults` is
# deep-merged into upstream's defaults, every other block is a named override
# selected with --configs, applied in the order given, and regex keys such as
# `.*\.units` match every config path ending that way. Upstream's own blocks
# (size1m, size12m, debug, ...) remain available, so a run is composed on the
# command line, e.g.
#
#   python -m carnav_dreamer.train --configs carnav size12m --logdir logdir/{timestamp}
#   python -m carnav_dreamer.train --configs carnav carnav_mac size1m --run.steps 3e5 ...
#   python -m carnav_dreamer.train --configs carnav carnav_mac debug --run.steps 3000 ...

defaults:
  logger:
    # wandb alongside upstream's own jsonl (our scripts and tests read
    # metrics.jsonl directly, so it stays even with wandb on). `scope` is
    # dropped: it's a second local dashboard we don't use, so keeping it
    # would just be another artifact to explain. Needs a WANDB_API_KEY in
    # the environment or `.env` (see carnav_dreamer/train.py::_setup_wandb_env);
    # override with `--logger.outputs jsonl` to disable network calls
    # entirely (tests do this).
    outputs: [jsonl, wandb]
  env:
    # Constructor kwargs for carnav_dreamer.env.CarNav. `use_seed` is consumed
    # by make_env (seed = hash((config.seed, env_index))) exactly as upstream
    # does for DMLab; `split_blocks` is the adapter's own switch; everything
    # else is forwarded to carnav.make. Upstream's flag parser only accepts
    # keys that already exist, so every env knob you want to set from the
    # command line has to be listed here (values are the env's own defaults).
    # width/height are the map in tiles: 48x48 (192 m) is what rl-env3d's
    # baseline table, figures and test_env use, so numbers here are comparable
    # with the README's; the env's CityConfig default is 64x64.
    carnav:
      use_seed: True
      split_blocks: True
      reward_scale: 1.0
      path_shaping: False
      intersection_targets: False
      width: 48
      height: 48
      n_targets: 3
      max_episode_steps: 1000
      action_repeat: 1
      stuck_steps: 150
      n_beams: 32
      n_traffic: 8
      n_parked: 18
      lidar_noise: 0.0
      pedestrians: False
      speed_signs: False
      red_light_penalty: 50.0
      time_penalty: 0.1
      turn_penalty: 0.0
      turn_penalty_threshold: 0.0

carnav:
  task: carnav_plain
  run:
    envs: 8
    train_ratio: 512     # gradient-steps-worth of replayed steps per env step; dmc_proprio uses 1024, crafter 512
    steps: 2e6
    log_every: 60
    report_every: 300
    save_every: 600

# Size tier is deliberately not baked in here -- pick one explicitly with
# --configs, e.g. `--configs carnav size12m`. Guidance, checked against the
# resolved latent width (deter + stoch*classes) vs. observation width per task:
#
#   task               obs dim   suggested size   deter+stoch*classes
#   carnav_plain        46       size1m           512 + 32*4   = 640
#   carnav_lights       53       size1m           640
#   carnav_traffic      66       size12m          2048 + 32*16 = 2560
#   carnav_full         73       size12m          2560
#   carnav_full_peds    93       size12m          2560
#
# size1m is exactly the tier upstream uses for dmc_proprio (proprioceptive
# continuous control, state dims ~24-60 -- the same order of magnitude as our
# 46/53-D tasks), so it's well precedented there, not a guess. traffic/full
# add eight independently controlled vehicles and a signal phase FSM to
# predict forward, which is a much richer *process* than the extra 13-20
# observation dims suggest, so size12m is the more defensible starting point
# -- but unlike the size1m choice, this one is reasoning from task structure,
# not measurement. `full_peds` adds pedestrians and their own reactive
# crossing behaviour on top of `full`; same size12m reasoning, same caveat.
# `scripts/train_gpu.sh` applies this mapping by default; override with
# `SIZE=`. Worth an explicit ablation (size1m vs size12m on carnav_full) once
# GPU time is available -- see notes/devlog.md.

# Apple-silicon development box: CPU JAX, float32 (bfloat16 is emulated and
# slow on CPU), no memory preallocation, fewer envs. Pair with size1m.
carnav_mac:
  jax: {platform: cpu, compute_dtype: float32, prealloc: False}
  run: {envs: 4, train_ratio: 256}
